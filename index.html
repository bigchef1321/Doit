<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mon Carnet</title>
<!-- PWA -->
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Mon Carnet"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#1A1B2E"/>
<link rel="manifest" href="manifest.json"/>

<!-- Icône écran d'accueil iPhone -->
<link rel="apple-touch-icon" href="icon.png"/>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp }                                        from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
                                                                from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, onSnapshot }               from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ══════════════════════════════════════
//  ⚙️  COLLE ICI TA CONFIG FIREBASE
// ══════════════════════════════════════
const firebaseConfig = {
  apiKey:            "REMPLACE_PAR_TON_API_KEY",
  authDomain:        "REMPLACE_PAR_TON_AUTH_DOMAIN",
  projectId:         "REMPLACE_PAR_TON_PROJECT_ID",
  storageBucket:     "REMPLACE_PAR_TON_STORAGE_BUCKET",
  messagingSenderId: "REMPLACE_PAR_TON_MESSAGING_SENDER_ID",
  appId:             "REMPLACE_PAR_TON_APP_ID"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);
let unsubscribe = null;

// ── Login / Logout ─────────────────────────────────
window.fbLogin = async () => {
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
  } catch(e) {
    console.error('Login error:', e.message);
    alert('Erreur de connexion : ' + e.message);
  }
};

window.fbLogout = async () => {
  if(unsubscribe) { unsubscribe(); unsubscribe = null; }
  await signOut(auth);
};

// ── Sauvegarde cloud ───────────────────────────────
window.cloudSave = async (data) => {
  const user = auth.currentUser;
  if(!user) return;
  try {
    await setDoc(doc(db, 'carnets', user.uid), data, { merge: true });
  } catch(e) { console.error('Save error:', e.message); }
};

// ── Écoute état auth ───────────────────────────────
onAuthStateChanged(auth, user => {
  if(user) {
    // Connecté
    document.getElementById('auth-btn').innerHTML =
      `<img src="${user.photoURL||''}" style="width:22px;height:22px;border-radius:50%;margin-right:6px;vertical-align:middle;"/>
       <span style="font-size:.72rem">${user.displayName?.split(' ')[0]||'Moi'}</span>`;
    document.getElementById('auth-btn').title = 'Se déconnecter';
    document.getElementById('auth-btn').onclick = fbLogout;
    document.getElementById('sync-indicator').textContent = '☁';
    document.getElementById('sync-indicator').title = 'Synchronisé';

    // Écoute temps réel Firestore
    if(unsubscribe) unsubscribe();
    unsubscribe = onSnapshot(doc(db, 'carnets', user.uid), snap => {
      if(!snap.exists()) return;
      const d = snap.data();
      if(d.todos)     { window.DB.todos     = d.todos;     renderTodos(); }
      if(d.citations) { window.DB.citations = d.citations; renderCitations(); }
      if(d.livres)    { window.DB.livres    = d.livres;    renderMedia('livres'); }
      if(d.musique)   { window.DB.musique   = d.musique;   renderMedia('musique'); }
      if(d.cinema)    { window.DB.cinema    = d.cinema;    renderMedia('cinema'); }
    });
  } else {
    // Déconnecté
    document.getElementById('auth-btn').innerHTML = `<span style="font-size:.75rem">☁ Sync</span>`;
    document.getElementById('auth-btn').title = 'Se connecter pour synchroniser';
    document.getElementById('auth-btn').onclick = fbLogin;
    document.getElementById('sync-indicator').textContent = '';
  }
});
</script>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1A1B2E;--surface:#23253A;--surface2:#2D2F4A;--border:#3A3C58;
  --violet:#7C6FCD;--violet-lt:#A99EE0;--gold:#D4AF6A;--cream:#F0EDE8;
  --muted:#8A8BA8;--danger:#E07C7C;--success:#6CC68A;--warn:#D4AF6A;
  --radius:12px;--radius-sm:7px;--shadow:0 4px 28px rgba(0,0,0,.4);--tr:.2s ease;
}
body{background:var(--bg);color:var(--cream);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:
  radial-gradient(ellipse 80% 50% at 20% 10%,rgba(124,111,205,.07) 0%,transparent 60%),
  radial-gradient(ellipse 60% 40% at 80% 90%,rgba(212,175,106,.05) 0%,transparent 60%);
  pointer-events:none;z-index:0}

/* ── SCREENS ── */
.screen{display:none;position:relative;z-index:1;max-width:720px;margin:0 auto;padding:0 16px calc(100px + env(safe-area-inset-bottom));animation:fadeUp .25s ease both}
.screen.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ── TOP BAR ── */
.topbar{
  position:sticky;top:0;z-index:200;
  background:rgba(26,27,46,.95);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;
  padding-top:max(14px, env(safe-area-inset-top));
}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-icon{font-size:1.3rem}
.topbar-title{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;color:var(--cream)}
.topbar-title em{font-style:italic;color:var(--violet-lt)}
.save-pill{font-size:.7rem;color:var(--success);background:rgba(108,198,138,.12);border:1px solid rgba(108,198,138,.25);border-radius:20px;padding:3px 10px;opacity:0;transition:opacity .3s}
.save-pill.show{opacity:1}

/* ── BOTTOM NAV ── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:rgba(26,27,46,.97);backdrop-filter:blur(16px);
  border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-around;
  padding:8px 0;
  padding-bottom:max(18px, env(safe-area-inset-bottom));
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  background:none;border:none;cursor:pointer;
  padding:6px 14px;border-radius:12px;
  transition:background var(--tr);
  user-select:none;-webkit-user-select:none;
  position:relative;
}
.nav-item .ni-icon{font-size:1.4rem;transition:transform .2s}
.nav-item .ni-label{font-family:'Inter',sans-serif;font-size:.62rem;font-weight:500;color:var(--muted);transition:color var(--tr)}
.nav-item.active .ni-label{color:var(--violet-lt)}
.nav-item.active .ni-icon{transform:scale(1.12)}
/* Anneau actif */
.nav-item.active::after{
  content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);
  width:24px;height:2px;background:var(--violet);border-radius:2px 2px 0 0;
}
/* Effet appui long */
.nav-item.pressing{background:rgba(124,111,205,.15)}
.nav-item.pressing .ni-icon{transform:scale(0.9)}
/* Tooltip appui long */
.nav-item::before{
  content:attr(data-hint);
  position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);
  background:var(--violet);color:#fff;font-size:.72rem;font-family:'Inter',sans-serif;
  padding:5px 10px;border-radius:8px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.nav-item.pressing::before{opacity:1}

/* ── FORM SCREEN (slide depuis le bas) ── */
.screen.form-screen{animation:slideUp .3s ease both}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

/* ── PAGE HEADER ── */
.page-header{padding:22px 0 14px;display:flex;align-items:center;justify-content:space-between}
.page-header h1{font-family:'Playfair Display',serif;font-size:clamp(1.5rem,5vw,2rem);font-weight:700;line-height:1.2}
.page-header h1 em{font-style:italic;color:var(--violet-lt)}
.page-header h2{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700;flex:1}
.back-btn{
  background:var(--surface);border:1px solid var(--border);border-radius:50%;
  color:var(--muted);cursor:pointer;width:38px;height:38px;
  display:flex;align-items:center;justify-content:center;font-size:1rem;
  flex-shrink:0;margin-right:12px;transition:all var(--tr);
}
.back-btn:hover{border-color:var(--violet);color:var(--cream)}

/* ── CARDS ── */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px 18px;margin-bottom:10px;
  transition:box-shadow var(--tr),border-color var(--tr);
  position:relative;user-select:none;-webkit-user-select:none;
}
.card:hover{box-shadow:var(--shadow)}
.card.pressing{border-color:var(--violet);box-shadow:0 0 0 2px rgba(124,111,205,.25)}
/* Actions cachées */
.card-actions{
  display:flex;gap:8px;justify-content:flex-end;
  overflow:hidden;max-height:0;opacity:0;
  transition:max-height .3s ease,opacity .25s ease,margin-top .25s,padding-top .25s;
  margin-top:0;padding-top:0;border-top:none;
}
.card.open .card-actions{
  max-height:50px;opacity:1;
  margin-top:12px;padding-top:10px;border-top:1px solid var(--border);
}
/* hint ··· */
.card:not(.open)::after{
  content:'···';position:absolute;bottom:8px;right:12px;
  font-size:.75rem;color:var(--border);pointer-events:none;
  letter-spacing:2px;
}

/* ── FORMS ── */
.form-stack{display:flex;flex-direction:column;gap:13px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-label{font-size:.72rem;font-weight:600;letter-spacing:.6px;color:var(--muted);text-transform:uppercase}
.input-field{
  width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--radius-sm);color:var(--cream);
  font-family:'Inter',sans-serif;font-size:.92rem;padding:12px 14px;outline:none;
  transition:border-color var(--tr);
}
.input-field::placeholder{color:var(--muted)}
.input-field:focus{border-color:var(--violet)}
select.input-field{cursor:pointer}
textarea.input-field{min-height:88px;resize:vertical;line-height:1.6}

/* ── BUTTONS ── */
.btn{
  background:var(--violet);border:none;border-radius:var(--radius-sm);
  color:#fff;cursor:pointer;font-family:'Inter',sans-serif;
  font-size:.88rem;font-weight:600;padding:11px 20px;
  transition:background var(--tr),transform .1s;white-space:nowrap;
}
.btn:hover{background:var(--violet-lt)}
.btn:active{transform:scale(.97)}
.btn-full{width:100%;padding:13px}
.btn-sm{padding:6px 12px;font-size:.75rem;border-radius:6px}
.btn-danger{background:rgba(224,124,124,.15);border:1px solid var(--danger);color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-edit{background:rgba(124,111,205,.12);border:1px solid var(--violet);color:var(--violet-lt)}
.btn-edit:hover{background:var(--violet);color:#fff}

/* ── BADGES ── */
.badge{font-size:.67rem;font-weight:600;border-radius:4px;padding:2px 7px;letter-spacing:.3px}
.badge-haute{background:rgba(224,124,124,.18);color:var(--danger)}
.badge-moyenne{background:rgba(212,175,106,.18);color:var(--gold)}
.badge-basse{background:rgba(108,198,138,.18);color:var(--success)}
.badge-a-faire{background:rgba(138,139,168,.18);color:var(--muted)}
.badge-en-cours{background:rgba(212,175,106,.18);color:var(--gold)}
.badge-fait{background:rgba(108,198,138,.18);color:var(--success)}
.badge-lu{background:rgba(108,198,138,.18);color:var(--success)}
.badge-vu{background:rgba(108,198,138,.18);color:var(--success)}
.badge-type{background:rgba(124,111,205,.15);color:var(--violet-lt)}
.tag{font-size:.67rem;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 7px;color:var(--muted)}
.meta{display:flex;gap:7px;align-items:center;margin-top:7px;flex-wrap:wrap}

/* ── SECTION BADGE (header) ── */
.count-badge{font-size:.73rem;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:3px 10px}

/* ── FILTER BAR ── */
.filter-bar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{
  background:transparent;border:1px solid var(--border);border-radius:20px;
  color:var(--muted);cursor:pointer;font-family:'Inter',sans-serif;
  font-size:.75rem;padding:4px 12px;transition:all var(--tr);
}
.filter-btn:hover,.filter-btn.active{background:var(--surface2);border-color:var(--violet);color:var(--cream)}

/* ── SEARCH ── */
.search-wrap{position:relative;margin-bottom:16px}
.search-wrap .input-field{padding-left:36px}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}

/* ── TODO ── */
.todo-row{display:flex;align-items:flex-start;gap:12px}
.check-box{
  flex-shrink:0;width:22px;height:22px;border:2px solid var(--border);
  border-radius:6px;background:var(--surface2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  margin-top:1px;font-size:12px;color:transparent;transition:all var(--tr);
}
.todo-row.done .check-box{background:var(--success);border-color:var(--success);color:#fff}
.todo-row.done .todo-text{text-decoration:line-through;color:var(--muted)}
.todo-body{flex:1;min-width:0}
.todo-text{font-size:.93rem;line-height:1.5}

/* ── TYPE TOGGLE ── */
.type-toggle{display:flex;gap:8px}
.type-btn{
  flex:1;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--radius-sm);color:var(--muted);cursor:pointer;
  font-family:'Inter',sans-serif;font-size:.83rem;padding:9px;transition:all var(--tr);
}
.type-btn.active{background:rgba(124,111,205,.18);border-color:var(--violet);color:var(--violet-lt)}

/* ── ENTRIES ── */
.entry-label{font-size:.65rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:2px 8px;border-radius:4px;display:inline-block;margin-bottom:8px}
.label-citation{background:rgba(212,175,106,.15);color:var(--gold)}
.label-mot{background:rgba(124,111,205,.15);color:var(--violet-lt)}
.entry-title{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;line-height:1.35;margin-bottom:5px}
.entry-italic{font-style:italic}
.entry-author{font-size:.82rem;color:var(--gold);margin-bottom:6px}
.entry-def{font-size:.88rem;line-height:1.7;color:#cac8e4}

/* ── MEDIA ── */
.media-row{display:flex;gap:14px;align-items:flex-start}
.media-thumb{
  flex-shrink:0;width:52px;height:68px;border-radius:8px;
  background:var(--surface2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:1.5rem;
}
.media-thumb.round{border-radius:50%;height:52px;width:52px}
.media-body{flex:1;min-width:0}
.media-title{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;line-height:1.3;margin-bottom:2px}
.media-sub{font-size:.8rem;color:var(--gold);margin-bottom:5px}
.media-note{font-size:.85rem;line-height:1.6;color:#cac8e4;margin-top:6px}
.stars{font-size:.95rem;letter-spacing:1px;margin-top:3px}

/* ── STARS PICKER ── */
.stars-picker{display:flex;gap:8px}
.star-btn{font-size:1.4rem;cursor:pointer;color:var(--border);transition:color .15s;background:none;border:none;padding:0}
.star-btn.on{color:var(--gold)}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:52px 20px;color:var(--muted)}
.empty .e-icon{font-size:2.4rem;margin-bottom:12px;opacity:.5}
.empty p{font-size:.88rem;line-height:1.7}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-left">
    <span class="topbar-icon" id="tb-icon">✓</span>
    <span class="topbar-title" id="tb-title">Mes <em>tâches</em></span>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <span class="save-pill" id="save-pill">✓ Sauvegardé</span>
    <span id="sync-indicator" style="color:var(--success);font-size:1rem" title=""></span>
    <button id="auth-btn" onclick="window.fbLogin&&fbLogin()" style="
      background:var(--surface2);border:1px solid var(--border);border-radius:20px;
      color:var(--cream);cursor:pointer;padding:5px 12px;
      font-family:'Inter',sans-serif;display:flex;align-items:center;
      transition:border-color .2s;white-space:nowrap;
    " onmouseover="this.style.borderColor='var(--violet)'" onmouseout="this.style.borderColor='var(--border)'">
      <span style="font-size:.75rem">☁ Sync</span>
    </button>
  </div>
</div>

<!-- ══════════════════════════════════
     TODOS — liste
══════════════════════════════════ -->
<div id="s-todos" class="screen active">
  <div class="page-header">
    <h1>Mes <em>tâches</em></h1>
    <span id="todos-count" class="count-badge">0</span>
  </div>
  <div class="filter-bar">
    <button class="filter-btn active" onclick="setFilter('all',this)">Toutes</button>
    <button class="filter-btn" onclick="setFilter('active',this)">À faire</button>
    <button class="filter-btn" onclick="setFilter('done',this)">Terminées</button>
    <button class="filter-btn" onclick="setFilter('haute',this)">🔴 Haute</button>
    <button class="filter-btn" onclick="setFilter('moyenne',this)">🟡 Moyenne</button>
    <button class="filter-btn" onclick="setFilter('basse',this)">🟢 Basse</button>
  </div>
  <div id="todos-list"></div>
</div>

<!-- TODOS — formulaire -->
<div id="s-todos-form" class="screen form-screen">
  <div class="page-header">
    <button class="back-btn" onclick="goBack()">←</button>
    <h2 id="todos-form-title">Nouvelle tâche</h2>
  </div>
  <div class="form-stack">
    <input type="hidden" id="todos-edit-id"/>
    <div class="form-group">
      <label class="form-label">Tâche</label>
      <input id="todos-text" class="input-field" type="text" placeholder="Que faut-il faire ?" onkeydown="if(event.key==='Enter')saveTodo()"/>
    </div>
    <div class="form-group">
      <label class="form-label">Priorité</label>
      <select id="todos-priority" class="input-field">
        <option value="haute">🔴 Haute</option>
        <option value="moyenne" selected>🟡 Moyenne</option>
        <option value="basse">🟢 Basse</option>
      </select>
    </div>
    <button class="btn btn-full" style="margin-top:4px" onclick="saveTodo()">Enregistrer</button>
  </div>
</div>

<!-- ══════════════════════════════════
     CITATIONS — liste
══════════════════════════════════ -->
<div id="s-citations" class="screen">
  <div class="page-header">
    <h1>Citations &amp; <em>Mots</em></h1>
    <span id="citations-count" class="count-badge">0</span>
  </div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input class="input-field" type="text" placeholder="Rechercher…" oninput="renderCitations(this.value)"/>
  </div>
  <div id="citations-list"></div>
</div>

<!-- CITATIONS — formulaire -->
<div id="s-citations-form" class="screen form-screen">
  <div class="page-header">
    <button class="back-btn" onclick="goBack()">←</button>
    <h2 id="citations-form-title">Nouvelle entrée</h2>
  </div>
  <div class="form-stack">
    <input type="hidden" id="citations-edit-id"/>
    <div class="form-group">
      <label class="form-label">Type</label>
      <div class="type-toggle">
        <button class="type-btn active" id="type-cit" onclick="setCitType('citation',this)">✦ Citation</button>
        <button class="type-btn" id="type-mot" onclick="setCitType('mot',this)">◈ Mot</button>
      </div>
    </div>
    <div id="cit-fields" class="form-stack">
      <div class="form-group"><label class="form-label">Citation</label>
        <textarea id="cit-text" class="input-field" placeholder="Entrez la citation…"></textarea></div>
      <div class="form-group"><label class="form-label">Auteur <span style="font-weight:400;text-transform:none;color:var(--muted)">(facultatif)</span></label>
        <input id="cit-author" class="input-field" type="text" placeholder="Nom de l'auteur…"/></div>
    </div>
    <div id="mot-fields" class="form-stack" style="display:none">
      <div class="form-group"><label class="form-label">Mot ou concept</label>
        <input id="mot-word" class="input-field" type="text" placeholder="Ex : sérendipité"/></div>
      <div class="form-group"><label class="form-label">Définition</label>
        <textarea id="mot-def" class="input-field" placeholder="Entrez la définition…"></textarea></div>
    </div>
    <button class="btn btn-full" style="margin-top:4px" onclick="saveCitation()">Enregistrer</button>
  </div>
</div>

<!-- ══════════════════════════════════

<nav class="bottom-nav">

    <span class="ni-icon">✓</span><span class="ni-label">Tâches</span>
  </button>
  <button class="nav-item" id="nav-citations"  data-hint="Nouvelle entrée"   onclick="navigate('citations')" onmousedown="startNavPress(this,'citations')" onmouseup="cancelNavPress()" onmouseleave="cancelNavPress()" ontouchstart="startNavPress(this,'citations')" ontouchend="cancelNavPress()" ontouchcancel="cancelNavPress()">
    <span class="ni-icon">✦</span><span class="ni-label">Citations</span>
  </button>
  <button class="nav-item" id="nav-livres"     data-hint="Nouveau livre"     onclick="navigate('livres')"    onmousedown="startNavPress(this,'livres')"    onmouseup="cancelNavPress()" onmouseleave="cancelNavPress()" ontouchstart="startNavPress(this,'livres')"    ontouchend="cancelNavPress()" ontouchcancel="cancelNavPress()">

  </button>

    <span class="ni-icon">🎵</span><span class="ni-label">Musique</span>
  </button>

    <span class="ni-icon">🎬</span><span class="ni-label">Cinéma</span>
  </button>

<script>
// ════════════════════════════════
//  DATA
// ════════════════════════════════
let DB = {
  todos:     JSON.parse(localStorage.getItem('todos')     || '[]'),
  citations: JSON.parse(localStorage.getItem('citations') || '[]'),
  livres:    JSON.parse(localStorage.getItem('livres')    || '[]'),
  musique:   JSON.parse(localStorage.getItem('musique')   || '[]'),
  cinema:    JSON.parse(localStorage.getItem('cinema')    || '[]'),
};

function save(key){
  // Sauvegarde locale
  localStorage.setItem(key, JSON.stringify(DB[key]));
  // Sauvegarde cloud (si connecté)
  if(window.cloudSave) {
    window.cloudSave({ [key]: DB[key] });
  }
  // Feedback visuel
  const p = document.getElementById('save-pill');
  p.classList.add('show');
  clearTimeout(p._t);
  p._t = setTimeout(()=>p.classList.remove('show'), 2000);
}

// ════════════════════════════════
//  NAVIGATION
// ════════════════════════════════
const SECTIONS = {
  todos:     { icon:'✓',  title:'Mes <em>tâches</em>' },
  citations: { icon:'✦',  title:'Citations &amp; <em>Mots</em>' },
  livres:    { icon:'📚', title:'Mes <em>Livres</em>' },
  musique:   { icon:'🎵', title:'Ma <em>Musique</em>' },
  cinema:    { icon:'🎬', title:'Mon <em>Cinéma</em>' },
};

let current = 'todos';
let navStack = [];

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el = document.getElementById('s-'+id);
  if(el) el.classList.add('active');
}

function navigate(section){
  current = section; navStack = [];
  showScreen(section);
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  const nb = document.getElementById('nav-'+section);
  if(nb) nb.classList.add('active');
  const cfg = SECTIONS[section];
  document.getElementById('tb-icon').textContent = cfg.icon;
  document.getElementById('tb-title').innerHTML = cfg.title;
}

function openForm(section){
  navStack.push(current);
  showScreen(section+'-form');
  // focus premier champ
  setTimeout(()=>{
    const f = document.querySelector('#s-'+section+'-form .input-field:not([type=hidden])');
    if(f) f.focus();
  },150);
}

function goBack(){
  const prev = navStack.pop() || current;
  // si on revient sur une liste, on remet le bon état nav
  if(SECTIONS[prev]) navigate(prev);
  else showScreen(prev);
}

// ════════════════════════════════
//  LONG PRESS — NAV
// ════════════════════════════════
let navPressTimer = null;
let navPressEl    = null;

function startNavPress(el, section){
  navPressEl = el;
  el.classList.add('pressing');
  navPressTimer = setTimeout(()=>{
    el.classList.remove('pressing');
    navPressEl = null;
    if(navigator.vibrate) navigator.vibrate(40);
    navigate(section);
    openForm(section);
    resetForm(section);
  }, 600);
}
function cancelNavPress(){
  if(navPressTimer){ clearTimeout(navPressTimer); navPressTimer=null; }
  if(navPressEl){ navPressEl.classList.remove('pressing'); navPressEl=null; }
}

// ════════════════════════════════
//  LONG PRESS — CARDS
// ════════════════════════════════
let cardPressTimer = null;
let cardPressEl    = null;

function attachCardPress(card){
  if(card.dataset.lp) return;
  card.dataset.lp = '1';
  const start = e => {
    if(e.target.closest('button,.check-box')) return;
    cardPressEl = card;
    card.classList.add('pressing');
    cardPressTimer = setTimeout(()=>{
      card.classList.remove('pressing');
      cardPressEl = null;
      if(navigator.vibrate) navigator.vibrate(35);
      // fermer les autres
      document.querySelectorAll('.card.open').forEach(c=>{ if(c!==card) c.classList.remove('open'); });
      card.classList.toggle('open');
    }, 500);
  };
  const cancel = () => {
    if(cardPressTimer){ clearTimeout(cardPressTimer); cardPressTimer=null; }
    if(cardPressEl){ cardPressEl.classList.remove('pressing'); cardPressEl=null; }
  };
  card.addEventListener('mousedown',   start);
  card.addEventListener('touchstart',  start, {passive:true});
  card.addEventListener('mouseup',     cancel);
  card.addEventListener('mouseleave',  cancel);
  card.addEventListener('touchend',    cancel);
  card.addEventListener('touchcancel', cancel);
  card.addEventListener('contextmenu', e=>e.preventDefault());
}

// Fermer actions si clic ailleurs
document.addEventListener('click', e=>{
  if(!e.target.closest('.card'))
    document.querySelectorAll('.card.open').forEach(c=>c.classList.remove('open'));
});

// Observer nouveaux cards
new MutationObserver(()=>{
  document.querySelectorAll('.card').forEach(attachCardPress);
}).observe(document.body,{childList:true,subtree:true});

// ════════════════════════════════
//  STARS PICKER
// ════════════════════════════════
function buildStars(uiId, hiddenId, val=0){
  const ui = document.getElementById(uiId); if(!ui) return;
  ui.innerHTML = '';
  for(let i=1;i<=5;i++){
    const b = document.createElement('button');
    b.className = 'star-btn' + (i<=val?' on':'');
    b.textContent = '★'; b.type = 'button';
    b.onclick = ()=>{
      document.getElementById(hiddenId).value = i;
      ui.querySelectorAll('.star-btn').forEach((s,idx)=>s.classList.toggle('on',idx<i));
    };
    ui.appendChild(b);
  }
}

// ════════════════════════════════
//  UTILS
// ════════════════════════════════
function esc(s=''){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function uid(){ return Date.now() + Math.random().toString(36).slice(2,6); }
function today(){ return new Date().toLocaleDateString('fr-FR'); }
function starsHtml(n){
  return Array.from({length:5},(_,i)=>`<span style="color:${i<n?'var(--gold)':'var(--border)'};font-size:.9rem">★</span>`).join('');
}

// ════════════════════════════════
//  TODOS
// ════════════════════════════════
let todoFilter = 'all';

function setFilter(f, btn){
  todoFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderTodos();
}

function resetForm(section){
  if(section==='todos'){
    document.getElementById('todos-edit-id').value = '';
    document.getElementById('todos-text').value = '';
    document.getElementById('todos-priority').value = 'moyenne';
    document.getElementById('todos-form-title').textContent = 'Nouvelle tâche';
  } else if(section==='citations'){
    document.getElementById('citations-edit-id').value = '';
    document.getElementById('cit-text').value = '';
    document.getElementById('cit-author').value = '';
    document.getElementById('mot-word').value = '';
    document.getElementById('mot-def').value = '';
    document.getElementById('citations-form-title').textContent = 'Nouvelle entrée';
    setCitType('citation', document.getElementById('type-cit'));
  } else {
    document.getElementById(section+'-edit-id').value = '';
    document.getElementById(section+'-titre').value = '';
    document.getElementById(section+'-stars').value = '0';
    buildStars(section+'-stars-ui', section+'-stars', 0);
    if(section==='livres'){ document.getElementById('livres-auteur').value=''; document.getElementById('livres-statut').value='a-faire'; document.getElementById('livres-note').value=''; }
    if(section==='musique'){ document.getElementById('musique-artiste').value=''; document.getElementById('musique-genre').value=''; document.getElementById('musique-note').value=''; }
    if(section==='cinema'){ document.getElementById('cinema-real').value=''; document.getElementById('cinema-type').value='Film'; document.getElementById('cinema-statut').value='a-faire'; document.getElementById('cinema-note').value=''; }
    const titles={livres:'Nouveau livre',musique:'Nouvel album',cinema:'Nouveau film'};
    document.getElementById(section+'-form-title').textContent = titles[section];
  }
}

function saveTodo(){
  const text = document.getElementById('todos-text').value.trim();
  if(!text){ document.getElementById('todos-text').focus(); return; }
  const editId = document.getElementById('todos-edit-id').value;
  const priority = document.getElementById('todos-priority').value;
  if(editId){
    const t = DB.todos.find(t=>t.id==editId);
    if(t){ t.text=text; t.priority=priority; }
  } else {
    DB.todos.unshift({id:uid(),text,priority,done:false,date:today()});
  }
  save('todos'); renderTodos(); goBack();
}

function editTodo(id){
  const t = DB.todos.find(t=>t.id===id); if(!t) return;
  document.getElementById('todos-edit-id').value = id;
  document.getElementById('todos-text').value = t.text;
  document.getElementById('todos-priority').value = t.priority;
  document.getElementById('todos-form-title').textContent = 'Modifier la tâche';
  navStack.push(current);
  showScreen('todos-form');
}

function toggleTodo(id){
  const t = DB.todos.find(t=>t.id===id);
  if(t){ t.done=!t.done; save('todos'); renderTodos(); }
}

function deleteTodo(id){
  if(!confirm('Supprimer ?')) return;
  DB.todos = DB.todos.filter(t=>t.id!==id);
  save('todos'); renderTodos();
}

function renderTodos(){
  let v = DB.todos;
  if(todoFilter==='active') v=v.filter(t=>!t.done);
  if(todoFilter==='done')   v=v.filter(t=>t.done);
  if(['haute','moyenne','basse'].includes(todoFilter)) v=v.filter(t=>t.priority===todoFilter);
  document.getElementById('todos-count').textContent = v.length+' tâche'+(v.length!==1?'s':'');
  const lbl={haute:'Haute',moyenne:'Moyenne',basse:'Basse'};
  const list = document.getElementById('todos-list');
  if(!v.length){ list.innerHTML=`<div class="empty"><div class="e-icon">📋</div><p>Appui long sur <strong>Tâches</strong><br>pour en ajouter une.</p></div>`; return; }
  list.innerHTML = v.map(t=>`
    <div class="card">
      <div class="todo-row ${t.done?'done':''}">
        <div class="check-box" onclick="toggleTodo('${t.id}')">${t.done?'✓':''}</div>
        <div class="todo-body">
          <div class="todo-text">${esc(t.text)}</div>
          <div class="meta">
            <span class="badge badge-${t.priority}">${lbl[t.priority]}</span>
            <span class="tag">${t.date}</span>
          </div>
        </div>
      </div>
      <div class="card-actions">
        <button class="btn btn-sm btn-edit" onclick="editTodo('${t.id}')">✎ Modifier</button>
        <button class="btn btn-sm btn-danger" onclick="deleteTodo('${t.id}')">✕ Supprimer</button>
      </div>
    </div>`).join('');
}

// ════════════════════════════════
//  CITATIONS & MOTS
// ════════════════════════════════
let citType = 'citation';

function setCitType(type, btn){
  citType = type;
  document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('cit-fields').style.display = type==='citation'?'':'none';
  document.getElementById('mot-fields').style.display = type==='mot'?'':'none';
}

function saveCitation(){
  const editId = document.getElementById('citations-edit-id').value;
  let entry;
  if(citType==='citation'){
    const text = document.getElementById('cit-text').value.trim();
    if(!text){ document.getElementById('cit-text').focus(); return; }
    entry = {id:editId||uid(),type:'citation',text,author:document.getElementById('cit-author').value.trim(),date:today()};
  } else {
    const word = document.getElementById('mot-word').value.trim();
    const def  = document.getElementById('mot-def').value.trim();
    if(!word||!def){ document.getElementById(!word?'mot-word':'mot-def').focus(); return; }
    entry = {id:editId||uid(),type:'mot',word,def,date:today()};
  }
  if(editId){ const i=DB.citations.findIndex(e=>e.id==editId); if(i>-1) DB.citations[i]=entry; }
  else DB.citations.unshift(entry);
  save('citations'); renderCitations(); goBack();
}

function editCitation(id){
  const e = DB.citations.find(e=>e.id===id); if(!e) return;
  document.getElementById('citations-edit-id').value = id;
  document.getElementById('citations-form-title').textContent = 'Modifier l\'entrée';
  if(e.type==='citation'){
    setCitType('citation',document.getElementById('type-cit'));
    document.getElementById('cit-text').value = e.text;
    document.getElementById('cit-author').value = e.author||'';
  } else {
    setCitType('mot',document.getElementById('type-mot'));
    document.getElementById('mot-word').value = e.word;
    document.getElementById('mot-def').value = e.def;
  }
  navStack.push(current);
  showScreen('citations-form');
}

function deleteCitation(id){
  if(!confirm('Supprimer ?')) return;
  DB.citations = DB.citations.filter(e=>e.id!==id);
  save('citations'); renderCitations();
}

function renderCitations(search=''){
  const q = search.toLowerCase();
  const v = DB.citations.filter(e=>
    e.type==='citation'
      ? e.text.toLowerCase().includes(q)||(e.author||'').toLowerCase().includes(q)
      : e.word.toLowerCase().includes(q)||e.def.toLowerCase().includes(q)
  );
  document.getElementById('citations-count').textContent = v.length+' entrée'+(v.length!==1?'s':'');
  const list = document.getElementById('citations-list');
  if(!v.length){ list.innerHTML=`<div class="empty"><div class="e-icon">✦</div><p>Appui long sur <strong>Citations</strong><br>pour en ajouter une.</p></div>`; return; }
  list.innerHTML = v.map(e=>{
    if(e.type==='citation') return `
      <div class="card">
        <span class="entry-label label-citation">✦ Citation</span>
        <div class="entry-title entry-italic">"${esc(e.text)}"</div>
        ${e.author?`<div class="entry-author">— ${esc(e.author)}</div>`:''}
        <div class="meta"><span class="tag">${e.date}</span></div>
        <div class="card-actions">
          <button class="btn btn-sm btn-edit" onclick="editCitation('${e.id}')">✎ Modifier</button>
          <button class="btn btn-sm btn-danger" onclick="deleteCitation('${e.id}')">✕ Supprimer</button>
        </div>
      </div>`;
    return `
      <div class="card">
        <span class="entry-label label-mot">◈ Mot</span>
        <div class="entry-title">${esc(e.word)}</div>
        <div class="entry-def">${esc(e.def)}</div>
        <div class="meta"><span class="tag">${e.date}</span></div>
        <div class="card-actions">
          <button class="btn btn-sm btn-edit" onclick="editCitation('${e.id}')">✎ Modifier</button>
          <button class="btn btn-sm btn-danger" onclick="deleteCitation('${e.id}')">✕ Supprimer</button>
        </div>
      </div>`;
  }).join('');
}

// ════════════════════════════════
//  MEDIA (livres / musique / cinéma)
// ════════════════════════════════
const MEDIA = {
  livres:  { icon:'📖', thumb:'📖', statusKey:'statut', statusLabels:{'a-faire':'À lire','en-cours':'En cours','lu':'Lu'}, badgeMap:{'a-faire':'a-faire','en-cours':'en-cours','lu':'lu'} },
  musique: { icon:'🎵', thumb:'🎵', round:true },
  cinema:  { icon:'🎬', thumb:'🎬', round:true, statusKey:'statut', statusLabels:{'a-faire':'À voir','en-cours':'En cours','vu':'Vu'}, badgeMap:{'a-faire':'a-faire','en-cours':'en-cours','vu':'vu'} },
};

const mediaFilters = {livres:'all', cinema:'all'};

function setMediaFilter(section, f, btn){
  mediaFilters[section] = f;
  btn.closest('.filter-bar').querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderMedia(section);
}

function saveMedia(section){
  const titre = document.getElementById(section+'-titre').value.trim();
  if(!titre){ document.getElementById(section+'-titre').focus(); return; }
  const editId = document.getElementById(section+'-edit-id').value;
  const stars = +document.getElementById(section+'-stars').value||0;
  let item = {id:editId||uid(), titre, stars, date:today()};
  if(section==='livres')  { item.auteur=document.getElementById('livres-auteur').value.trim(); item.statut=document.getElementById('livres-statut').value; item.note=document.getElementById('livres-note').value.trim(); }
  if(section==='musique') { item.artiste=document.getElementById('musique-artiste').value.trim(); item.genre=document.getElementById('musique-genre').value.trim(); item.note=document.getElementById('musique-note').value.trim(); }
  if(section==='cinema')  { item.real=document.getElementById('cinema-real').value.trim(); item.type=document.getElementById('cinema-type').value; item.statut=document.getElementById('cinema-statut').value; item.note=document.getElementById('cinema-note').value.trim(); }
  if(editId){ const i=DB[section].findIndex(x=>x.id==editId); if(i>-1) DB[section][i]=item; else DB[section].unshift(item); }
  else DB[section].unshift(item);
  save(section); renderMedia(section); goBack();
}

function editMedia(section, id){
  const item = DB[section].find(x=>x.id===id); if(!item) return;
  document.getElementById(section+'-edit-id').value = id;
  document.getElementById(section+'-titre').value = item.titre||'';
  document.getElementById(section+'-stars').value = item.stars||0;
  buildStars(section+'-stars-ui', section+'-stars', item.stars||0);
  if(section==='livres')  { document.getElementById('livres-auteur').value=item.auteur||''; document.getElementById('livres-statut').value=item.statut||'a-faire'; document.getElementById('livres-note').value=item.note||''; }
  if(section==='musique') { document.getElementById('musique-artiste').value=item.artiste||''; document.getElementById('musique-genre').value=item.genre||''; document.getElementById('musique-note').value=item.note||''; }
  if(section==='cinema')  { document.getElementById('cinema-real').value=item.real||''; document.getElementById('cinema-type').value=item.type||'Film'; document.getElementById('cinema-statut').value=item.statut||'a-faire'; document.getElementById('cinema-note').value=item.note||''; }
  const titles={livres:'Modifier le livre',musique:'Modifier l\'album',cinema:'Modifier le film'};
  document.getElementById(section+'-form-title').textContent = titles[section];
  navStack.push(current);
  showScreen(section+'-form');
}

function deleteMedia(section, id){
  if(!confirm('Supprimer ?')) return;
  DB[section] = DB[section].filter(x=>x.id!==id);
  save(section); renderMedia(section);
}

function renderMedia(section, search=''){
  const cfg = MEDIA[section];
  const q = search.toLowerCase();
  let v = DB[section].filter(x=>(x.titre||'').toLowerCase().includes(q)||((x.auteur||x.artiste||x.real)||'').toLowerCase().includes(q));
  // filtre statut
  const f = mediaFilters[section];
  if(f && f!=='all') v = v.filter(x=>x.statut===f);
  document.getElementById(section+'-count').textContent = v.length+' élément'+(v.length!==1?'s':'');
  const list = document.getElementById(section+'-list');
  if(!v.length){ list.innerHTML=`<div class="empty"><div class="e-icon">${cfg.icon}</div><p>Appui long sur <strong>${section.charAt(0).toUpperCase()+section.slice(1)}</strong><br>pour en ajouter un.</p></div>`; return; }
  list.innerHTML = v.map(item=>{
    const sub = item.auteur||item.artiste||item.real||'';
    const statusHtml = item.statut&&cfg.statusLabels ? `<span class="badge badge-${cfg.badgeMap[item.statut]}">${cfg.statusLabels[item.statut]}</span>` : '';
    const extraHtml  = item.genre?`<span class="tag">${esc(item.genre)}</span>`:item.type?`<span class="tag">${esc(item.type)}</span>`:'';
    return `
    <div class="card">
      <div class="media-row">
        <div class="media-thumb ${cfg.round?'round':''}">${cfg.thumb}</div>
        <div class="media-body">
          <div class="media-title">${esc(item.titre)}</div>
          ${sub?`<div class="media-sub">${esc(sub)}</div>`:''}
          <div class="meta">${statusHtml}${extraHtml}<span class="tag">${item.date}</span></div>
          ${item.stars?`<div class="stars">${starsHtml(item.stars)}</div>`:''}
          ${item.note?`<div class="media-note">${esc(item.note)}</div>`:''}
        </div>
      </div>
      <div class="card-actions">
        <button class="btn btn-sm btn-edit" onclick="editMedia('${section}','${item.id}')">✎ Modifier</button>
        <button class="btn btn-sm btn-danger" onclick="deleteMedia('${section}','${item.id}')">✕ Supprimer</button>
      </div>
    </div>`;
  }).join('');
}

buildStars('livres-stars-ui',  'livres-stars',  0);
buildStars('musique-stars-ui', 'musique-stars', 0);
buildStars('cinema-stars-ui',  'cinema-stars',  0);

// ════════════════════════════════
// Exposer DB et renders pour le module Firebase
window.DB            = DB;
window.renderTodos     = renderTodos;
window.renderCitations = renderCitations;
window.renderMedia     = renderMedia;

renderTodos();
renderCitations();
renderMedia('livres');
renderMedia('musique');
renderMedia('cinema');
</script>
