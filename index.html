<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mon Espace Personnel</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #1A1B2E;
      --surface:   #23253A;
      --surface2:  #2D2F4A;
      --border:    #3A3C58;
      --violet:    #7C6FCD;
      --violet-lt: #A99EE0;
      --gold:      #D4AF6A;
      --cream:     #F0EDE8;
      --muted:     #8A8BA8;
      --danger:    #E07C7C;
      --success:   #6CC68A;
      --radius:    12px;
      --radius-sm: 7px;
      --shadow:    0 4px 24px rgba(0,0,0,0.35);
      --transition: 0.22s ease;
    }

    body {
      background: var(--bg);
      color: var(--cream);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Background texture ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 10%, rgba(124,111,205,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 90%, rgba(212,175,106,0.06) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .app {
      position: relative;
      z-index: 1;
      max-width: 780px;
      margin: 0 auto;
      padding: 0 16px 60px;
    }

    /* ── Header ── */
    header {
      padding: 40px 0 28px;
      text-align: center;
    }
    header .eyebrow {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 10px;
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 700;
      color: var(--cream);
      line-height: 1.15;
    }
    header h1 em {
      font-style: italic;
      color: var(--violet-lt);
    }

    /* ── Tab nav ── */
    .tabs {
      display: flex;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 5px;
      margin: 24px auto 36px;
      max-width: 420px;
    }
    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 10px 16px;
      border-radius: 50px;
      cursor: pointer;
      transition: background var(--transition), color var(--transition);
      white-space: nowrap;
    }
    .tab-btn:hover { color: var(--cream); }
    .tab-btn.active {
      background: var(--violet);
      color: #fff;
      box-shadow: 0 2px 12px rgba(124,111,205,0.35);
    }

    /* ── Panels ── */
    .panel { display: none; animation: fadeUp 0.3s ease both; }
    .panel.active { display: block; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Section heading ── */
    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .section-head h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 700;
    }
    .count-badge {
      font-size: 0.78rem;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 10px;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 12px;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .card:hover { border-color: var(--border); box-shadow: var(--shadow); }

    /* ════════════════════════════
       TODO LIST
    ════════════════════════════ */
    .todo-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 28px;
    }
    .input-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .input-field {
      flex: 1;
      min-width: 180px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--cream);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      padding: 11px 14px;
      outline: none;
      transition: border-color var(--transition);
    }
    .input-field::placeholder { color: var(--muted); }
    .input-field:focus { border-color: var(--violet); }

    select.input-field { cursor: pointer; appearance: none; padding-right: 30px; }

    .btn {
      background: var(--violet);
      border: none;
      border-radius: var(--radius-sm);
      color: #fff;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 11px 22px;
      transition: background var(--transition), transform 0.1s;
      white-space: nowrap;
    }
    .btn:hover { background: var(--violet-lt); }
    .btn:active { transform: scale(0.97); }
    .btn-sm {
      padding: 6px 12px;
      font-size: 0.78rem;
      border-radius: 6px;
    }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: #f09090; }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .btn-ghost:hover { border-color: var(--violet); color: var(--cream); background: transparent; }

    .filter-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--muted);
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      padding: 5px 14px;
      transition: all var(--transition);
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--surface2);
      border-color: var(--violet);
      color: var(--cream);
    }

    .todo-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    .todo-check {
      flex-shrink: 0;
      width: 22px; height: 22px;
      border: 2px solid var(--border);
      border-radius: 6px;
      background: var(--surface2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
      transition: all var(--transition);
      font-size: 13px;
      color: transparent;
    }
    .todo-item.done .todo-check {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }
    .todo-item.done .todo-text { text-decoration: line-through; color: var(--muted); }

    .todo-body { flex: 1; }
    .todo-text { font-size: 0.95rem; line-height: 1.5; }
    .todo-meta {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .priority-badge {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      border-radius: 4px;
      padding: 2px 7px;
    }
    .priority-haute  { background: rgba(224,124,124,0.18); color: var(--danger); }
    .priority-moyenne { background: rgba(212,175,106,0.18); color: var(--gold); }
    .priority-basse   { background: rgba(108,198,138,0.18); color: var(--success); }

    .todo-date { font-size: 0.72rem; color: var(--muted); }
    .todo-actions { flex-shrink: 0; display: flex; gap: 6px; }

    .empty-state {
      text-align: center;
      padding: 52px 20px;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.6; }
    .empty-state p { font-size: 0.9rem; }

    /* ════════════════════════════
       CITATIONS & MOTS
    ════════════════════════════ */
    .entry-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
      margin-bottom: 28px;
    }
    .entry-form h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: var(--violet-lt);
    }
    .form-grid {
      display: grid;
      gap: 12px;
    }
    textarea.input-field {
      width: 100%;
      min-height: 88px;
      resize: vertical;
      line-height: 1.6;
    }

    /* type toggle */
    .type-toggle {
      display: flex;
      gap: 6px;
      margin-bottom: 4px;
    }
    .type-btn {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--muted);
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      padding: 8px;
      transition: all var(--transition);
    }
    .type-btn.active {
      background: rgba(124,111,205,0.2);
      border-color: var(--violet);
      color: var(--violet-lt);
    }

    .entry-card { position: relative; }

    .entry-type-label {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 10px;
    }
    .type-citation  { background: rgba(212,175,106,0.15); color: var(--gold); }
    .type-mot       { background: rgba(124,111,205,0.15); color: var(--violet-lt); }

    .entry-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 8px;
    }
    .entry-citation { font-style: italic; }

    .entry-sub {
      font-size: 0.83rem;
      color: var(--gold);
      margin-bottom: 10px;
    }
    .entry-def {
      font-size: 0.9rem;
      line-height: 1.7;
      color: #cac8e4;
    }
    .entry-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .entry-date { font-size: 0.72rem; color: var(--muted); }

    .search-bar {
      position: relative;
      margin-bottom: 18px;
    }
    .search-bar .input-field { width: 100%; padding-left: 38px; }
    .search-icon {
      position: absolute;
      left: 12px; top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 14px;
      pointer-events: none;
    }

    /* divider rule between form sections */
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 20px 0;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    @media (max-width: 500px) {
      .input-row { flex-direction: column; }
      .todo-actions { gap: 4px; }
    }
  </style>
</head>
<body>
<div class="app">

  <header>
    <p class="eyebrow">Espace personnel</p>
    <h1>Mon <em>Carnet</em> Numérique</h1>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" onclick="switchTab('todo', this)">✓ Tâches</button>
    <button class="tab-btn"        onclick="switchTab('entries', this)">✦ Citations & Mots</button>
  </nav>

  <!-- ════════ TODO PANEL ════════ -->
  <div id="panel-todo" class="panel active">

    <div class="todo-form card">
      <div class="input-row">
        <input id="todo-input" class="input-field" type="text"
               placeholder="Ajouter une tâche…" onkeydown="if(event.key==='Enter') addTodo()"/>
        <select id="todo-priority" class="input-field" style="max-width:140px">
          <option value="haute">🔴 Haute</option>
          <option value="moyenne" selected>🟡 Moyenne</option>
          <option value="basse">🟢 Basse</option>
        </select>
        <button class="btn" onclick="addTodo()">Ajouter</button>
      </div>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" onclick="setFilter('all', this)">Toutes</button>
      <button class="filter-btn"        onclick="setFilter('active', this)">À faire</button>
      <button class="filter-btn"        onclick="setFilter('done', this)">Terminées</button>
      <button class="filter-btn"        onclick="setFilter('haute', this)">🔴 Haute</button>
      <button class="filter-btn"        onclick="setFilter('moyenne', this)">🟡 Moyenne</button>
      <button class="filter-btn"        onclick="setFilter('basse', this)">🟢 Basse</button>
    </div>

    <div class="section-head">
      <h2>Mes tâches</h2>
      <span id="todo-count" class="count-badge">0</span>
    </div>

    <div id="todo-list"></div>
  </div>

  <!-- ════════ ENTRIES PANEL ════════ -->
  <div id="panel-entries" class="panel">

    <div class="entry-form">
      <h3>Ajouter une entrée</h3>

      <div class="type-toggle">
        <button class="type-btn active" id="type-citation" onclick="setEntryType('citation', this)">✦ Citation</button>
        <button class="type-btn"        id="type-mot"      onclick="setEntryType('mot', this)">◈ Mot à retenir</button>
      </div>

      <div class="form-grid">
        <!-- Citation fields -->
        <div id="fields-citation">
          <textarea id="entry-text" class="input-field" placeholder="Entrez la citation…"></textarea>
          <input id="entry-author" class="input-field" style="margin-top:10px" type="text" placeholder="Auteur (facultatif)"/>
        </div>

        <!-- Mot fields -->
        <div id="fields-mot" style="display:none">
          <input id="entry-mot" class="input-field" type="text" placeholder="Mot ou concept…"/>
          <textarea id="entry-definition" class="input-field" style="margin-top:10px" placeholder="Définition ou explication…"></textarea>
        </div>

        <button class="btn" style="justify-self:start; margin-top:4px" onclick="addEntry()">Enregistrer</button>
      </div>
    </div>

    <div class="search-bar">
      <span class="search-icon">⌕</span>
      <input class="input-field" type="text" placeholder="Rechercher…" oninput="renderEntries(this.value)"/>
    </div>

    <div class="section-head">
      <h2>Ma collection</h2>
      <span id="entry-count" class="count-badge">0</span>
    </div>

    <div id="entry-list"></div>
  </div>

</div>

<script>
  // ── State ──────────────────────────────────────────
  let todos   = JSON.parse(localStorage.getItem('todos')   || '[]');
  let entries = JSON.parse(localStorage.getItem('entries') || '[]');
  let todoFilter  = 'all';
  let entryType   = 'citation';

  function save() {
    localStorage.setItem('todos',   JSON.stringify(todos));
    localStorage.setItem('entries', JSON.stringify(entries));
  }

  // ── Tabs ───────────────────────────────────────────
  function switchTab(name, btn) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('panel-' + name).classList.add('active');
    btn.classList.add('active');
  }

  // ── TODO ───────────────────────────────────────────
  function addTodo() {
    const text = document.getElementById('todo-input').value.trim();
    if (!text) return;
    todos.unshift({
      id:       Date.now(),
      text,
      priority: document.getElementById('todo-priority').value,
      done:     false,
      date:     new Date().toLocaleDateString('fr-FR')
    });
    save();
    document.getElementById('todo-input').value = '';
    renderTodos();
  }

  function toggleTodo(id) {
    const t = todos.find(t => t.id === id);
    if (t) { t.done = !t.done; save(); renderTodos(); }
  }

  function deleteTodo(id) {
    todos = todos.filter(t => t.id !== id);
    save(); renderTodos();
  }

  function setFilter(f, btn) {
    todoFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTodos();
  }

  function renderTodos() {
    let visible = todos;
    if (todoFilter === 'active')  visible = todos.filter(t => !t.done);
    if (todoFilter === 'done')    visible = todos.filter(t =>  t.done);
    if (['haute','moyenne','basse'].includes(todoFilter))
      visible = todos.filter(t => t.priority === todoFilter);

    document.getElementById('todo-count').textContent =
      visible.length + ' tâche' + (visible.length !== 1 ? 's' : '');

    const list = document.getElementById('todo-list');
    if (!visible.length) {
      list.innerHTML = `<div class="empty-state">
        <div class="icon">📋</div>
        <p>Aucune tâche ici.<br>Ajoutez-en une ci-dessus.</p>
      </div>`;
      return;
    }

    const priorityLabel = { haute: 'Haute', moyenne: 'Moyenne', basse: 'Basse' };

    list.innerHTML = visible.map(t => `
      <div class="card todo-item ${t.done ? 'done' : ''}">
        <div class="todo-check" onclick="toggleTodo(${t.id})">${t.done ? '✓' : ''}</div>
        <div class="todo-body">
          <div class="todo-text">${escHtml(t.text)}</div>
          <div class="todo-meta">
            <span class="priority-badge priority-${t.priority}">${priorityLabel[t.priority]}</span>
            <span class="todo-date">${t.date}</span>
          </div>
        </div>
        <div class="todo-actions">
          <button class="btn btn-sm btn-danger" onclick="deleteTodo(${t.id})">✕</button>
        </div>
      </div>
    `).join('');
  }

  // ── ENTRIES ────────────────────────────────────────
  function setEntryType(type, btn) {
    entryType = type;
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('fields-citation').style.display = type === 'citation' ? '' : 'none';
    document.getElementById('fields-mot').style.display      = type === 'mot'      ? '' : 'none';
  }

  function addEntry() {
    let entry;
    if (entryType === 'citation') {
      const text = document.getElementById('entry-text').value.trim();
      if (!text) return;
      entry = {
        id:     Date.now(),
        type:   'citation',
        text,
        author: document.getElementById('entry-author').value.trim(),
        date:   new Date().toLocaleDateString('fr-FR')
      };
      document.getElementById('entry-text').value = '';
      document.getElementById('entry-author').value = '';
    } else {
      const mot = document.getElementById('entry-mot').value.trim();
      const def = document.getElementById('entry-definition').value.trim();
      if (!mot || !def) return;
      entry = {
        id:         Date.now(),
        type:       'mot',
        mot,
        definition: def,
        date:       new Date().toLocaleDateString('fr-FR')
      };
      document.getElementById('entry-mot').value = '';
      document.getElementById('entry-definition').value = '';
    }
    entries.unshift(entry);
    save();
    renderEntries();
  }

  function deleteEntry(id) {
    entries = entries.filter(e => e.id !== id);
    save(); renderEntries();
  }

  function renderEntries(search = '') {
    const q = search.toLowerCase();
    const visible = entries.filter(e => {
      if (e.type === 'citation')
        return e.text.toLowerCase().includes(q) || (e.author||'').toLowerCase().includes(q);
      return e.mot.toLowerCase().includes(q) || e.definition.toLowerCase().includes(q);
    });

    document.getElementById('entry-count').textContent =
      visible.length + ' entrée' + (visible.length !== 1 ? 's' : '');

    const list = document.getElementById('entry-list');
    if (!visible.length) {
      list.innerHTML = `<div class="empty-state">
        <div class="icon">✦</div>
        <p>Aucune entrée trouvée.<br>Ajoutez une citation ou un mot ci-dessus.</p>
      </div>`;
      return;
    }

    list.innerHTML = visible.map(e => {
      if (e.type === 'citation') return `
        <div class="card entry-card">
          <span class="entry-type-label type-citation">✦ Citation</span>
          <div class="entry-title entry-citation">"${escHtml(e.text)}"</div>
          ${e.author ? `<div class="entry-sub">— ${escHtml(e.author)}</div>` : ''}
          <div class="entry-footer">
            <span class="entry-date">${e.date}</span>
            <button class="btn btn-sm btn-danger" onclick="deleteEntry(${e.id})">Supprimer</button>
          </div>
        </div>`;
      return `
        <div class="card entry-card">
          <span class="entry-type-label type-mot">◈ Mot</span>
          <div class="entry-title">${escHtml(e.mot)}</div>
          <div class="entry-def">${escHtml(e.definition)}</div>
          <div class="entry-footer">
            <span class="entry-date">${e.date}</span>
            <button class="btn btn-sm btn-danger" onclick="deleteEntry(${e.id})">Supprimer</button>
          </div>
        </div>`;
    }).join('');
  }

  // ── Utils ──────────────────────────────────────────
  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Init ───────────────────────────────────────────
  renderTodos();
  renderEntries();
</script>
</body>
</html>
